services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: storyloom
      POSTGRES_PASSWORD: storyloom
      POSTGRES_DB: storyloom
    ports:
      - "5432:5432"
    volumes:
      - storyloom_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyloom -d storyloom"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  storyloom_postgres:
